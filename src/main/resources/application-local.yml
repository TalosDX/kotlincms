spring:
  mustache:
    check-template-location: false
  jpa:
    database: postgresql
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  datasource:
    url: jdbc:postgresql://localhost:5432/cms?autoReconnect=true&useUnicode=true&characterEncoding=UTF-8
    username: cmsuser
    password: cmspassword
  mail:
    protocol: smtp
    host: localhost
    port: 1025



